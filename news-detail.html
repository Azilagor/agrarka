      <div id="sidebar-mount"></div>

        <nav aria-label="Основная навигация">
          <ul>

      <header class="topbar">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>

        <div id="topbar-brand-mount"></div>

          </ol>
        </nav>
        <div id="newsDetail">
          <header class="page-header">

              <span class="page-header__eyebrow" data-field="category">Новости</span>
              <h1 data-field="title">Заголовок новости</h1>
              <p><time data-field="date" datetime="">1 января 2026</time></p>

          <section class="section">

              <div id="newsDetailMedia" style="border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px;" hidden></div>
              <div id="newsDetailBody" class="flow"></div>

                <div class="share-buttons" id="newsShare"></div>

              <div class="card-grid" id="newsRelated"></div>
